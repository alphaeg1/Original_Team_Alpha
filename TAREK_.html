<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAREK | Personal Landing Page</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Variables - Color Palette */
        :root {
            --bg-beige: #F5EFE6;      /* بيج دافي واضح */
            --olive-dark: #2A3B2C;     /* زيتي داكن أنيق */
            --olive-light: #485E4B;    /* زيتي متوسط */
            --olive-accent: #8FA382;   /* زيتي فاتح للإضاءة */
            --text-dark: #1E281F;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-beige);
            color: var(--text-dark);
            overflow-x: hidden;
            position: relative;
            padding-bottom: 120px;
            min-height: 100vh;
        }

        /* Animated Fluid Background Shapes */
        .bg-shape {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            border-radius: 50%;
            animation: float 10s infinite alternate ease-in-out;
        }

        .shape1 {
            width: 380px;
            height: 380px;
            background: var(--olive-light);
            top: -60px;
            right: -60px;
        }

        .shape2 {
            width: 320px;
            height: 320px;
            background: var(--olive-accent);
            bottom: 80px;
            left: -60px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 70px) scale(1.15); }
        }

        /* Hero Section */
        .hero {
            padding-top: 60px;
            padding-bottom: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .avatar-box {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--olive-dark);
            border: 4px solid var(--olive-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-beige);
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(42, 59, 44, 0.25);
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(72, 94, 75, 0.5); }
            70% { box-shadow: 0 0 0 22px rgba(72, 94, 75, 0); }
            100% { box-shadow: 0 0 0 0 rgba(72, 94, 75, 0); }
        }

        .hero h1 {
            font-size: 2.8rem;
            color: var(--olive-dark);
            margin-bottom: 8px;
            font-weight: 800;
        }

        /* Typewriter Animation Class */
        .typing-text {
            font-size: 1.3rem;
            color: var(--olive-light);
            font-weight: 600;
            min-height: 35px;
            border-left: 3px solid var(--olive-dark);
            padding-left: 8px;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: var(--olive-dark); }
        }

        /* Social Media Links Section */
        .social-container {
            max-width: 680px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .social-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(72, 94, 75, 0.2);
            border-radius: 20px;
            padding: 18px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--olive-dark);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
        }

        .social-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .social-info i {
            font-size: 1.8rem;
            color: var(--olive-dark);
            transition: transform 0.3s ease;
        }

        .social-info span {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .arrow-icon {
            font-size: 1.1rem;
            opacity: 0.6;
            transition: transform 0.3s ease;
        }

        .social-card:hover {
            transform: translateY(-5px) scale(1.02);
            background: var(--olive-dark);
            color: var(--bg-beige);
            border-color: var(--olive-dark);
            box-shadow: 0 15px 30px rgba(42, 59, 44, 0.3);
        }

        .social-card:hover .social-info i,
        .social-card:hover .arrow-icon {
            color: var(--bg-beige);
            transform: translateX(-6px);
            opacity: 1;
        }

        /* Bottom Floating CTA Bar */
        .bottom-cta-bar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--olive-dark);
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            border: 1px solid var(--olive-accent);
            animation: slideUp 1s ease-out;
            width: 90%;
            max-width: 500px;
            justify-content: space-between;
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 100px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .bottom-cta-bar span {
            color: var(--bg-beige);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .cta-btn {
            background: var(--bg-beige);
            color: var(--olive-dark);
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .cta-btn:hover {
            background: var(--olive-accent);
            color: var(--white);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(143, 163, 130, 0.6);
        }

        @media (max-width: 480px) {
            .hero h1 { font-size: 2.2rem; }
            .bottom-cta-bar span { font-size: 0.85rem; }
            .cta-btn { padding: 8px 16px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <!-- Dynamic Background Shapes -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <!-- Hero Section -->
    <section class="hero">
        <div class="avatar-box">TAREK</div>
        <h1>طـــارق</h1>
        <div class="typing-text" id="typing"></div>
    </section>

    <!-- Social Links Section -->
    <div class="social-container">
        
        <a href="https://instagram.com/YOUR_USERNAME" target="_blank" class="social-card">
            <div class="social-info">
                <i class="fa-brands fa-instagram"></i>
                <span>إنستجرام | Instagram</span>
            </div>
            <i class="fa-solid fa-arrow-left arrow-icon"></i>
        </a>

        <a href="https://tiktok.com/@YOUR_USERNAME" target="_blank" class="social-card">
            <div class="social-info">
                <i class="fa-brands fa-tiktok"></i>
                <span>تيك توك | TikTok</span>
            </div>
            <i class="fa-solid fa-arrow-left arrow-icon"></i>
        </a>

        <a href="https://facebook.com/YOUR_USERNAME" target="_blank" class="social-card">
            <div class="social-info">
                <i class="fa-brands fa-facebook-f"></i>
                <span>فيسبوك | Facebook</span>
            </div>
            <i class="fa-solid fa-arrow-left arrow-icon"></i>
        </a>

        <a href="https://youtube.com/@YOUR_USERNAME" target="_blank" class="social-card">
            <div class="social-info">
                <i class="fa-brands fa-youtube"></i>
                <span>يوتيوب | YouTube</span>
            </div>
            <i class="fa-solid fa-arrow-left arrow-icon"></i>
        </a>

        <a href="https://wa.me/YOUR_PHONE_NUMBER" target="_blank" class="social-card">
            <div class="social-info">
                <i class="fa-brands fa-whatsapp"></i>
                <span>واتساب | WhatsApp</span>
            </div>
            <i class="fa-solid fa-arrow-left arrow-icon"></i>
        </a>

    </div>

    <!-- Bottom Fixed Action Bar -->
    <div class="bottom-cta-bar">
        <span>عايز ويب سايت زي دي؟</span>
        <a href="https://wa.me/YOUR_PHONE_NUMBER" class="cta-btn" target="_blank">
            دوس هنا ⚡
        </a>
    </div>

    <script>
        // Typewriter Effect
        const words = ["أهلاً بك في حساباتي 🌟", "تواصل معي مباشرة 📩", "تابع جديدي باستمرار 🚀"];
        let count = 0;
        let index = 0;
        let currentText = "";
        let letter = "";

        (function type() {
            if (count === words.length) {
                count = 0;
            }
            currentText = words[count];
            letter = currentText.slice(0, ++index);

            document.getElementById("typing").textContent = letter;
            if (letter.length === currentText.length) {
                count++;
                index = 0;
                setTimeout(type, 2000);
            } else {
                setTimeout(type, 100);
            }
        })();
    </script>
</body>
</html>
