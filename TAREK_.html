<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAREK | Personal Landing Page</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Variables - Color Palette (No White Allowed in BG) */
        :root {
            --bg-camel: #C5A075;        /* جملي / بيج غني دافئ */
            --bg-camel-light: #D8B58A;  /* جملي فاتح */
            --olive-dark: #202D21;      /* زيتي داكن عميق */
            --olive-light: #364838;     /* زيتي متوسط */
            --olive-accent: #6E836A;    /* زيتي للحدود */
            --text-camel: #EAD0B3;     /* نص جملي فاتح */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* خلفية جملي وزيتي متوازنة بدون أي بياض */
            background: linear-gradient(135deg, var(--bg-camel) 0%, var(--bg-camel) 50%, var(--olive-dark) 50%, var(--olive-dark) 100%);
            background-attachment: fixed;
            color: var(--text-camel);
            overflow-x: hidden;
            position: relative;
            padding-bottom: 120px;
            min-height: 100vh;
        }

        /* Dynamic Background Shapes (pure camel & olive) */
        .bg-shape {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.7;
            border-radius: 50%;
            animation: float 10s infinite alternate ease-in-out;
        }

        .shape1 {
            width: 450px;
            height: 450px;
            background: var(--olive-dark);
            top: -100px;
            left: -100px;
        }

        .shape2 {
            width: 400px;
            height: 400px;
            background: var(--bg-camel);
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 70px) scale(1.15); }
        }

        /* Hero Section */
        .hero {
            padding-top: 50px;
            padding-bottom: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Profile Picture with Olive & Camel Border */
        .profile-img-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid var(--bg-camel);
            outline: 4px solid var(--olive-accent);
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            animation: pulse 3s infinite;
            overflow: hidden;
            background-color: var(--olive-dark);
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(197, 160, 117, 0.6); }
            70% { box-shadow: 0 0 0 22px rgba(197, 160, 117, 0); }
            100% { box-shadow: 0 0 0 0 rgba(197, 160, 117, 0); }
        }

        .hero h1 {
            font-size: 2.8rem;
            color: var(--text-camel);
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.4);
        }

        /* Typewriter Animation Class */
        .typing-text {
            font-size: 1.2rem;
            color: var(--bg-camel);
            font-weight: 600;
            min-height: 35px;
            border-right: 3px solid var(--bg-camel);
            padding-right: 8px;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: var(--bg-camel); }
        }

        /* Social Media Links Section */
        .social-container {
            max-width: 650px;
            margin: 15px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .social-card {
            background: var(--olive-dark); /* خلفية زيتي داكن بدون أبيض */
            border: 2px solid var(--bg-camel);
            border-radius: 20px;
            padding: 16px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--bg-camel);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .social-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .social-info i {
            font-size: 1.8rem;
            color: var(--bg-camel);
            transition: transform 0.3s ease;
        }

        .social-info span {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .arrow-icon {
            font-size: 1.1rem;
            opacity: 0.8;
            transition: transform 0.3s ease;
        }

        .social-card:hover {
            transform: translateY(-5px) scale(1.02);
            background: var(--bg-camel);
            color: var(--olive-dark);
            border-color: var(--olive-dark);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .social-card:hover .social-info i,
        .social-card:hover .arrow-icon {
            color: var(--olive-dark);
            transform: translateX(6px);
            opacity: 1;
        }

        /* Bottom Floating CTA Bar */
        .bottom-cta-bar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--olive-dark);
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            border: 2px solid var(--bg-camel);
            animation: slideUp 1s ease-out;
            width: 90%;
            max-width: 500px;
            justify-content: space-between;
            direction: rtl;
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 100px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .bottom-cta-bar span {
            color: var(--bg-camel);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .cta-btn {
            background: var(--bg-camel);
            color: var(--olive-dark);
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .cta-btn:hover {
            background: var(--text-camel);
            color: var(--olive-dark);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(234, 208, 179, 0.4);
        }

        @media (max-width: 480px) {
            .hero h1 { font-size: 2.2rem; }
            .bottom-cta-bar span { font-size: 0.85rem; }
            .cta-btn { padding: 8px 16px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <!-- Dynamic Background Shapes -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <!-- Hero Section -->
    <section class="hero">
        <!-- Profile Image with Frame -->
        <div class="profile-img-container">
            <img src="YOUR_IMAGE_URL.jpg" alt="TAREK">
        </div>
        
        <!-- English Name -->
        <h1>TAREK</h1>
        <div class="typing-text" id="typing"></div>
    </section>

    <!-- Social Links Section -->
    <div class="social-container">
        
        <a href="https://instagram.com/YOUR_USERNAME" target="_blank" class="social-card">
            <div class="social-info">
                <i class="fa-brands fa-instagram"></i>
                <span>Instagram</span>
            </div>
            <i class="fa-solid fa-arrow-right arrow-icon"></i>
        </a>

        <a href="https://tiktok.com/@YOUR_USERNAME" target="_blank" class="social-card">
            <div class="social-info">
                <i class="fa-brands fa-tiktok"></i>
                <span>TikTok</span>
            </div>
            <i class="fa-solid fa-arrow-right arrow-icon"></i>
        </a>

        <a href="https://facebook.com/YOUR_USERNAME" target="_blank" class="social-card">
            <div class="social-info">
                <i class="fa-brands fa-facebook-f"></i>
                <span>Facebook</span>
            </div>
            <i class="fa-solid fa-arrow-right arrow-icon"></i>
        </a>

        <a href="https://youtube.com/@YOUR_USERNAME" target="_blank" class="social-card">
            <div class="social-info">
                <i class="fa-brands fa-youtube"></i>
                <span>YouTube</span>
            </div>
            <i class="fa-solid fa-arrow-right arrow-icon"></i>
        </a>

        <a href="https://wa.me/YOUR_PHONE_NUMBER" target="_blank" class="social-card">
            <div class="social-info">
                <i class="fa-brands fa-whatsapp"></i>
                <span>WhatsApp</span>
            </div>
            <i class="fa-solid fa-arrow-right arrow-icon"></i>
        </a>

    </div>

    <!-- Bottom Fixed Action Bar -->
    <div class="bottom-cta-bar">
        <span>عايز ويب سايت زي دي؟</span>
        <a href="https://wa.me/YOUR_PHONE_NUMBER" class="cta-btn" target="_blank">
            دوس هنا ⚡
        </a>
    </div>

    <script>
        // Typewriter Effect
        const words = ["Welcome to my official links 🌟", "Connect with me directly 📩", "Follow my daily updates 🚀"];
        let count = 0;
        let index = 0;
        let currentText = "";
        let letter = "";

        (function type() {
            if (count === words.length) {
                count = 0;
            }
            currentText = words[count];
            letter = currentText.slice(0, ++index);

            document.getElementById("typing").textContent = letter;
            if (letter.length === currentText.length) {
                count++;
                index = 0;
                setTimeout(type, 2000);
            } else {
                setTimeout(type, 100);
            }
        })();
    </script>
</body>
</html>
