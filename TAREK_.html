<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAREK | Official Links</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Cairo for Ultra Professional Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables - Premium Camel & Olive Palette */
        :root {
            --bg-camel: #C5A075;         /* جملي غني */
            --bg-camel-light: #D8B58A;   /* جملي فاتح */
            --bg-camel-glow: #e2ba8c;    /* جملي مضيء */
            --olive-dark: #1A241B;       /* زيتي داكن عميق جداً */
            --olive-card: #233124;       /* زيتي للكروت */
            --olive-light: #364838;      /* زيتي متوسط */
            --olive-accent: #5C7258;     /* زيتي للحدود والتفاصيل */
            --text-camel: #EAD0B3;      /* نص جملي ذهبي ناعم */
            --text-gold: #F4E3C9;       /* ذهبي فاتح للنصوص الهامة */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #161F17 0%, #28211A 50%, var(--olive-dark) 100%);
            background-attachment: fixed;
            color: var(--text-camel);
            overflow-x: hidden;
            position: relative;
            padding-bottom: 140px;
            min-height: 100vh;
        }

        /* Ambient Dynamic Background Shapes */
        .bg-shape {
            position: fixed;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.6;
            border-radius: 50%;
            animation: float 12s infinite alternate ease-in-out;
        }

        .shape1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--bg-camel) 0%, rgba(32, 45, 33, 0) 70%);
            top: -150px;
            right: -150px;
        }

        .shape2 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--olive-accent) 0%, rgba(32, 45, 33, 0) 70%);
            bottom: -100px;
            left: -100px;
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 60px) scale(1.1); }
        }

        /* Hero Section */
        .hero {
            padding-top: 45px;
            padding-bottom: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            direction: ltr;
        }

        /* Profile Container with Multiple Glowing Rings */
        .profile-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .profile-wrapper::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--bg-camel), var(--olive-accent), var(--bg-camel-light));
            animation: spinGlow 6s linear infinite;
            filter: blur(8px);
            opacity: 0.7;
        }

        @keyframes spinGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .profile-img-container {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid var(--bg-camel);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            background-color: var(--olive-dark);
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero h1 {
            font-size: 2.6rem;
            color: var(--text-gold);
            margin-bottom: 6px;
            font-weight: 900;
            letter-spacing: 3px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        /* Typewriter Styling */
        .typing-container {
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .typing-text {
            font-size: 1.15rem;
            color: var(--bg-camel-light);
            font-weight: 700;
            border-right: 3px solid var(--bg-camel);
            padding-right: 8px;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: var(--bg-camel); }
        }

        /* Modern Modernized Social Links Container */
        .social-container {
            max-width: 620px;
            margin: 10px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            direction: ltr;
        }

        /* Premium Glassmorphism Cards */
        .social-card {
            position: relative;
            background: linear-gradient(135deg, rgba(35, 49, 36, 0.85) 0%, rgba(22, 31, 23, 0.9) 100%);
            border: 1px solid rgba(197, 160, 117, 0.3);
            border-radius: 22px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-camel);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            overflow: hidden;
        }

        .social-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(197, 160, 117, 0.15), transparent);
            transition: left 0.7s ease;
        }

        .social-card:hover::before {
            left: 100%;
        }

        .social-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        /* Icon Badge with Glow */
        .icon-box {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(197, 160, 117, 0.15) 0%, rgba(54, 72, 56, 0.4) 100%);
            border: 1px solid rgba(197, 160, 117, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--bg-camel-glow);
            transition: all 0.4s ease;
            box-shadow: inset 0 0 10px rgba(197, 160, 117, 0.1);
        }

        .social-text-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .social-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-gold);
            letter-spacing: 0.5px;
        }

        .social-subtitle {
            font-size: 0.8rem;
            color: var(--olive-accent);
            font-weight: 600;
            margin-top: 2px;
            transition: color 0.3s ease;
        }

        .arrow-box {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(197, 160, 117, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-camel);
            font-size: 0.95rem;
            transition: all 0.4s ease;
        }

        /* Hover Effects */
        .social-card:hover {
            transform: translateY(-5px) scale(1.015);
            border-color: var(--bg-camel);
            background: linear-gradient(135deg, rgba(48, 66, 49, 0.95) 0%, rgba(28, 38, 29, 0.95) 100%);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(197, 160, 117, 0.2);
        }

        .social-card:hover .icon-box {
            background: var(--bg-camel);
            color: var(--olive-dark);
            border-color: var(--text-gold);
            transform: rotate(-8deg) scale(1.1);
            box-shadow: 0 0 18px rgba(197, 160, 117, 0.5);
        }

        .social-card:hover .arrow-box {
            background: var(--bg-camel);
            color: var(--olive-dark);
            transform: translateX(5px);
            box-shadow: 0 0 12px rgba(197, 160, 117, 0.4);
        }

        .social-card:hover .social-subtitle {
            color: var(--bg-camel-light);
        }

        /* Custom Colors Per Brand on Hover (Subtle & Elegant) */
        .instagram-card:hover .icon-box { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366); color: #fff; border:none; }
        .tiktok-card:hover .icon-box { background: #000; color: #ff0050; border:1px solid #00f2fe; }
        .facebook-card:hover .icon-box { background: #1877f2; color: #fff; border:none; }
        .youtube-card:hover .icon-box { background: #ff0000; color: #fff; border:none; }
        .whatsapp-card:hover .icon-box { background: #25d366; color: #fff; border:none; }

        /* Floating Ultra-Professional CTA Bar */
        .bottom-cta-bar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(26, 36, 27, 0.95) 0%, rgba(18, 26, 19, 0.98) 100%);
            padding: 10px 18px;
            border-radius: 60px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 1px 1px rgba(197, 160, 117, 0.3);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            border: 1.5 solid var(--bg-camel);
            backdrop-filter: blur(15px);
            width: 92%;
            max-width: 520px;
            justify-content: space-between;
            direction: rtl;
        }

        .cta-right-side {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* TA Floating Logo Box */
        .ta-logo-box {
            position: relative;
            width: 52px;
            height: 44px;
            background: rgba(35, 49, 36, 0.8);
            border: 1.5px solid var(--bg-camel);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }

        /* Randomly Moving Floating TA Logo */
        .ta-logo-moving {
            position: absolute;
            font-weight: 900;
            font-size: 0.95rem;
            color: var(--olive-dark);
            background: linear-gradient(135deg, var(--bg-camel-glow), var(--bg-camel));
            width: 26px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            letter-spacing: -0.5px;
            animation: moveRandom 7s ease-in-out infinite alternate;
        }

        @keyframes moveRandom {
            0%   { top: 2px;  left: 2px; }
            25%  { top: 18px; left: 22px; }
            50%  { top: 2px;  left: 22px; }
            75%  { top: 18px; left: 2px; }
            100% { top: 10px; left: 12px; }
        }

        .cta-text {
            display: flex;
            flex-direction: column;
        }

        .cta-text span.main-title {
            color: var(--text-gold);
            font-size: 0.95rem;
            font-weight: 800;
            line-height: 1.2;
        }

        .cta-text span.sub-title {
            color: var(--olive-accent);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .cta-btn {
            background: linear-gradient(135deg, var(--bg-camel) 0%, var(--bg-camel-light) 100%);
            color: var(--olive-dark);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(197, 160, 117, 0.3);
        }

        .cta-btn i {
            font-size: 0.85rem;
            transition: transform 0.3s ease;
        }

        .cta-btn:hover {
            background: linear-gradient(135deg, var(--text-gold) 0%, var(--bg-camel) 100%);
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(197, 160, 117, 0.5);
        }

        .cta-btn:hover i {
            transform: translateY(-2px) scale(1.2);
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            .hero h1 { font-size: 2.2rem; }
            .profile-img-container { width: 120px; height: 120px; }
            .social-card { padding: 14px 18px; }
            .icon-box { width: 45px; height: 45px; font-size: 1.3rem; }
            .social-title { font-size: 1.1rem; }
            .bottom-cta-bar { padding: 8px 12px; }
            .cta-text span.main-title { font-size: 0.85rem; }
            .cta-text span.sub-title { display: none; }
            .cta-btn { padding: 8px 14px; font-size: 0.8rem; }
            .ta-logo-box { width: 44px; height: 38px; }
            .ta-logo-moving { width: 22px; height: 20px; font-size: 0.8rem; }
            @keyframes moveRandom {
                0%   { top: 2px;  left: 2px; }
                25%  { top: 14px; left: 18px; }
                50%  { top: 2px;  left: 18px; }
                75%  { top: 14px; left: 2px; }
                100% { top: 8px;  left: 10px; }
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Dynamic Background Shapes -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <!-- Hero Section -->
    <section class="hero">
        <div class="profile-wrapper">
            <div class="profile-img-container">
                <img src="WhatsApp Image‏ 2026-08-10 at 19.54.25 (1).jpeg" alt="TAREK">
            </div>
        </div>
        
        <h1>TAREK</h1>
        <div class="typing-container">
            <div class="typing-text" id="typing"></div>
        </div>
    </section>

    <!-- Social Links Section -->
    <div class="social-container">
        
        <!-- Instagram -->
        <a href="https://instagram.com/YOUR_USERNAME" target="_blank" class="social-card instagram-card">
            <div class="social-info">
                <div class="icon-box">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <div class="social-text-group">
                    <span class="social-title">Instagram</span>
                    <span class="social-subtitle">Follow my daily updates</span>
                </div>
            </div>
            <div class="arrow-box">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </a>

        <!-- TikTok -->
        <a href="https://tiktok.com/@YOUR_USERNAME" target="_blank" class="social-card tiktok-card">
            <div class="social-info">
                <div class="icon-box">
                    <i class="fa-brands fa-tiktok"></i>
                </div>
                <div class="social-text-group">
                    <span class="social-title">TikTok</span>
                    <span class="social-subtitle">Watch short videos & reels</span>
                </div>
            </div>
            <div class="arrow-box">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </a>

        <!-- Facebook -->
        <a href="https://facebook.com/YOUR_USERNAME" target="_blank" class="social-card facebook-card">
            <div class="social-info">
                <div class="icon-box">
                    <i class="fa-brands fa-facebook-f"></i>
                </div>
                <div class="social-text-group">
                    <span class="social-title">Facebook</span>
                    <span class="social-subtitle">Connect on my personal page</span>
                </div>
            </div>
            <div class="arrow-box">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </a>

        <!-- YouTube -->
        <a href="https://youtube.com/@YOUR_USERNAME" target="_blank" class="social-card youtube-card">
            <div class="social-info">
                <div class="icon-box">
                    <i class="fa-brands fa-youtube"></i>
                </div>
                <div class="social-text-group">
                    <span class="social-title">YouTube</span>
                    <span class="social-subtitle">Subscribe for full episodes</span>
                </div>
            </div>
            <div class="arrow-box">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </a>

        <!-- WhatsApp -->
        <a href="https://wa.me/YOUR_PHONE_NUMBER" target="_blank" class="social-card whatsapp-card">
            <div class="social-info">
                <div class="icon-box">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>
                <div class="social-text-group">
                    <span class="social-title">WhatsApp</span>
                    <span class="social-subtitle">Direct chat & business</span>
                </div>
            </div>
            <div class="arrow-box">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </a>

    </div>

    <!-- Floating Action Bar (CTA) -->
    <div class="bottom-cta-bar">
        <div class="cta-right-side">
            <!-- Box with Animated TA Logo -->
            <div class="ta-logo-box">
                <div class="ta-logo-moving">TA</div>
            </div>
            <div class="cta-text">
                <span class="main-title">عايز ويب سايت زي دي؟</span>
                <span class="sub-title">تصميم مخصص وفخم لك</span>
            </div>
        </div>

        <a href="https://wa.me/YOUR_PHONE_NUMBER" class="cta-btn" target="_blank">
            <span>تواصل معي</span>
            <i class="fa-solid fa-bolt"></i>
        </a>
    </div>

    <script>
        // Smooth Typewriter Effect with Eraser Functionality
        const words = ["Welcome to my official links 🌟", "Connect with me directly 📩", "Follow my daily updates 🚀"];
        let i = 0;
        
        function typingEffect() {
            let word = words[i].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typing').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 2200);
                    return false;
                }
                setTimeout(loopTyping, 90);
            };
            loopTyping();
        }

        function deletingEffect() {
            let word = words[i].split("");
            var loopDeleting = function() {
                if (word.length > 0) {
                    word.pop();
                    document.getElementById('typing').innerHTML = word.join("");
                } else {
                    if (words.length > (i + 1)) {
                        i++;
                    } else {
                        i = 0;
                    }
                    typingEffect();
                    return false;
                }
                setTimeout(loopDeleting, 40);
            };
            loopDeleting();
        }

        typingEffect();
    </script>
</body>
</html>
