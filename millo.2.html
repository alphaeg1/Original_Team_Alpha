<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة نقاط العملاء</title>
<style>
body { font-family: sans-serif; text-align: center; background-color: #f4f4f4; padding: 50px; }
.container { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
button { padding: 10px 20px; background-color: #5c3b8a; color: white; border: none; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
<h1>تحديث نقاط الكلاينت</h1>
<input type="text" id="clientId" placeholder="رقم الكلاينت">
<input type="number" id="pointsToAdd" placeholder="عدد النقاط المراد إضافتها">
<button onclick="updatePoints()">إضافة النقاط</button>
</div>
<script>
function updatePoints() {
const clientId = document.getElementById('clientId').value;
const pointsToAdd = parseInt(document.getElementById('pointsToAdd').value);
// Here we'll add logic to connect to Supabase later
console.log('Updating client:', clientId, 'with points:', pointsToAdd);
}
</script>
</body>
</html>
