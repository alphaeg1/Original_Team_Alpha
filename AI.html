<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مولد أفكار OFFGRID</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --card-border: #232d42;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #10b981;
            --error-color: #ef4444;
            --offgrid-gradient: linear-gradient(135deg, #ff4655 0%, #ff8533 50%, #facc15 100%);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* الهيدر والوجو */
        .header-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            gap: 8px;
        }

        .logo-placeholder {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px dashed #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-text-hint {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
        }

        .main-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            text-align: center;
        }

        .offgrid-badge {
            background: var(--offgrid-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: Impact, sans-serif, system-ui;
            letter-spacing: 2px;
            font-size: 1.8rem;
            text-shadow: 0 0 20px rgba(255, 70, 85, 0.2);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label { 
            font-size: 0.82rem; 
            color: var(--text-muted); 
            font-weight: 600; 
        }

        input, textarea {
            background-color: var(--bg-color);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        .api-input-container {
            display: flex;
            gap: 8px;
        }

        .btn-test {
            background-color: #1e293b;
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 0 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
        }

        button.btn-primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
        }

        .btn-download {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 14px;
        }

        #apiStatus {
            font-size: 0.8rem;
            margin-top: 4px;
        }

        /* التقرير القابل للتصدير */
        #exportContainer {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .export-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 12px;
            margin-bottom: 14px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .export-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--card-border);
        }

        .brand-info {
            display: flex;
            flex-direction: column;
        }

        .plan-client-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #ffffff;
        }

        /* تحسين استجابة الجداول */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .output-table {
            width: 100%;
            min-width: 650px; /* ضمان طول السطور وعدم التكدس */
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        .output-table th {
            background-color: #0f172a;
            color: #818cf8;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 10px 12px;
            text-align: right;
            white-space: nowrap;
        }

        .output-table td {
            background-color: #151c2c;
            border-bottom: 1px solid var(--card-border);
            padding: 12px;
            vertical-align: top;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.75rem;
            display: inline-block;
            white-space: nowrap;
        }

        .badge-reel { background-color: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
        .badge-poster { background-color: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.4); }

        .shot-card {
            background: #0f172a;
            border-right: 3px solid var(--accent-color);
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .shot-title {
            font-weight: 700;
            color: #38bdf8;
            font-size: 0.8rem;
        }

        .shot-desc {
            color: #cbd5e1;
            font-size: 0.83rem;
            white-space: normal;
        }

        /* قسم الملاحظات الثابتة */
        .default-notes-box {
            margin-top: 14px;
            padding: 10px 12px;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px dashed var(--card-border);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .default-notes-title {
            font-weight: 700;
            color: #818cf8;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header-brand">
        <div class="logo-placeholder" onclick="document.getElementById('logoInput').click()">
            <img id="logoPreview" src="" style="display:none;">
            <span id="logoText" class="logo-text-hint">رفع<br>لوجو</span>
        </div>
        <input type="file" id="logoInput" accept="image/*" style="display:none" onchange="loadLogo(event)">

        <div class="main-title">
            مولد أفكار <span class="offgrid-badge">OFFGRID</span>
        </div>
    </div>

    <div class="card">
        <div class="form-grid">
            <div class="form-group">
                <label for="apiKey">Gemini API Key</label>
                <div class="api-input-container">
                    <input type="password" id="apiKey" placeholder="أدخل المفتاح هنا">
                    <button class="btn-test" onclick="testApiKey()">اختبار 🔍</button>
                </div>
                <div id="apiStatus"></div>
            </div>

            <div class="form-row-2">
                <div class="form-group">
                    <label for="clientName">اسم العميل</label>
                    <input type="text" id="clientName" placeholder="مثال: مطعم زوز">
                </div>
                <div class="form-group">
                    <label for="industry">المجال</label>
                    <input type="text" id="industry" placeholder="أكلات سريعة">
                </div>
            </div>

            <div class="form-row-2">
                <div class="form-group">
                    <label for="reelsCount">عدد الريلز</label>
                    <input type="number" id="reelsCount" value="4" min="0">
                </div>
                <div class="form-group">
                    <label for="postersCount">عدد البوسترات</label>
                    <input type="number" id="postersCount" value="4" min="0">
                </div>
            </div>

            <div class="form-group">
                <label for="goals">أهداف الحملة الحالية</label>
                <textarea id="goals" rows="2" placeholder="زيادة المبيعات والعروض..."></textarea>
            </div>

            <div class="form-group">
                <label for="defaultNotes">ملاحظات وشروط ثابتة (تظهر مع كل خطة)</label>
                <textarea id="defaultNotes" rows="2" placeholder="مثال: مدة التنفيذ 7 أيام - يشمل التعديل مرتين مجاناً..." oninput="saveDefaultNotes()"></textarea>
            </div>
        </div>

        <button id="generateBtn" class="btn-primary" onclick="generateContent()">توليد الخطة ✨</button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <div id="loading" style="display:none; text-align:center; padding: 16px; color: var(--text-muted); font-size: 0.9rem;">
            جاري تحضير الخطة وتقسيم الشوتات... ⏳
        </div>
        
        <div id="exportContainer">
            <div class="export-header">
                <div class="header-left">
                    <img id="exportLogoImg" class="export-logo" style="display:none;">
                    <div class="brand-info">
                        <div class="plan-client-title" id="planTitle">📋 خطة المحتوى</div>
                        <small style="color: var(--text-muted); font-size: 0.75rem;">TEAM ALPHA</small>
                    </div>
                </div>
                <div class="offgrid-badge" style="font-size: 1.2rem;">OFFGRID</div>
            </div>

            <div class="table-responsive">
                <div id="outputContainer"></div>
            </div>

            <div id="exportNotesBox" class="default-notes-box" style="display:none;">
                <div class="default-notes-title">📌 ملاحظات الشروط والأحكام:</div>
                <div id="exportNotesText"></div>
            </div>
        </div>

        <button id="downloadBtn" class="btn-download" style="display:none;" onclick="downloadAsImage()">تحميل التقرير كصورة 📸</button>
    </div>

</div>

<script>
// تحميل الملاحظات الثابتة من الموبايل تلقائياً
window.onload = function() {
    const savedNotes = localStorage.getItem('offgrid_default_notes');
    if (savedNotes) {
        document.getElementById('defaultNotes').value = savedNotes;
    }
}

function saveDefaultNotes() {
    const val = document.getElementById('defaultNotes').value;
    localStorage.setItem('offgrid_default_notes', val);
}

// رفع وشعارات اللوجو
let uploadedLogoUrl = '';
function loadLogo(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            uploadedLogoUrl = e.target.result;
            
            const preview = document.getElementById('logoPreview');
            preview.src = uploadedLogoUrl;
            preview.style.display = 'block';
            document.getElementById('logoText').style.display = 'none';

            const exportImg = document.getElementById('exportLogoImg');
            exportImg.src = uploadedLogoUrl;
            exportImg.style.display = 'block';
        }
        reader.readAsDataURL(file);
    }
}

async function testApiKey() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const statusDiv = document.getElementById('apiStatus');
    
    if (!apiKey) {
        statusDiv.style.color = "var(--error-color)";
        statusDiv.innerText = "⚠️ أدخل المفتاح أولاً!";
        return;
    }

    statusDiv.style.color = "var(--text-muted)";
    statusDiv.innerText = "جاري التحقق...";

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        if (res.ok) {
            statusDiv.style.color = "var(--success-color)";
            statusDiv.innerText = "✅ المفتاح شغال تمام!";
        } else {
            statusDiv.style.color = "var(--error-color)";
            statusDiv.innerText = "❌ المفتاح غير صحيح.";
        }
    } catch (e) {
        statusDiv.style.color = "var(--error-color)";
        statusDiv.innerText = "❌ خطأ في الاتصال.";
    }
}

async function generateContent() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const clientName = document.getElementById('clientName').value.trim();
    const industry = document.getElementById('industry').value.trim();
    const reelsCount = document.getElementById('reelsCount').value;
    const postersCount = document.getElementById('postersCount').value;
    const goals = document.getElementById('goals').value.trim();
    const defaultNotes = document.getElementById('defaultNotes').value.trim();

    if (!apiKey || !clientName || !industry) {
        alert('برجاء كتابة المفتاح، اسم العميل، والمجال!');
        return;
    }

    const btn = document.getElementById('generateBtn');
    const resultCard = document.getElementById('resultCard');
    const loading = document.getElementById('loading');
    const outputContainer = document.getElementById('outputContainer');
    const downloadBtn = document.getElementById('downloadBtn');

    btn.disabled = true;
    resultCard.style.display = 'block';
    loading.style.display = 'block';
    downloadBtn.style.display = 'none';
    outputContainer.innerHTML = '';

    document.getElementById('planTitle').innerText = `📋 خطة: ${clientName}`;

    // إضافة الملاحظات للتقرير
    const exportNotesBox = document.getElementById('exportNotesBox');
    if (defaultNotes) {
        document.getElementById('exportNotesText').innerText = defaultNotes;
        exportNotesBox.style.display = 'block';
    } else {
        exportNotesBox.style.display = 'none';
    }

    const promptText = `أنت صانع محتوى إبداعي ومخرج إعلانات. قم بإنشاء خطة محتوى شهرية لعميل:
- البراند: ${clientName}
- المجال: ${industry}
- الهدف: ${goals}
- المطلوب: ${reelsCount} فيديو ريلز (Reels) و ${postersCount} تصميم بوستر (Posters).

⚠️ لكل فيديو Reel، اقسم السكريبت لشوتات سينمائية (Shots) تحتوي على المشهد والتعليق.
ولكل بوستر (Poster)، ضع تفاصيل الفكرة والنص الإعلاني.

ارجع الناتج في صيغة JSON Array فقط بدون markdown.
[
  {
    "type": "Reel",
    "title": "عنوان الفكرة الجذاب",
    "shots": [
      { "name": "Shot 1 - Hook", "desc": "وصف المشهد والبداية" },
      { "name": "Shot 2 - Value", "desc": "وصف تفاصيل العرض" },
      { "name": "Shot 3 - CTA", "desc": "المشهد النهائي" }
    ],
    "audio_or_style": "الصوت المقترح"
  }
]`;

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }]
            })
        });

        const data = await response.json();
        
        if (response.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
            let rawText = data.candidates[0].content.parts[0].text;
            rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();

            const ideas = JSON.parse(rawText);
            renderTable(ideas);
            downloadBtn.style.display = 'block';
        } else {
            outputContainer.innerHTML = `<div style="color:var(--error-color); text-align:center;">⚠️ فشل التوليد، تأكد من المفتاح.</div>`;
        }
    } catch (e) {
        outputContainer.innerHTML = `<div style="color:var(--error-color); text-align:center;">⚠️ خطأ في الاتصال بالشبكة.</div>`;
    }

    btn.disabled = false;
    loading.style.display = 'none';
}

function renderTable(ideas) {
    let html = `
        <table class="output-table">
            <thead>
                <tr>
                    <th style="width: 15%;">النوع</th>
                    <th style="width: 25%;">عنوان الفكرة</th>
                    <th style="width: 42%;">التفاصيل والسكريبت (Shots)</th>
                    <th style="width: 18%;">الصوت / الستايل</th>
                </tr>
            </thead>
            <tbody>
    `;

    ideas.forEach(item => {
        const typeStr = item.type || 'Reel';
        const isReel = typeStr.toLowerCase().includes('reel');
        const badgeClass = isReel ? 'badge-reel' : 'badge-poster';
        
        let shotsHtml = '';
        if (item.shots && Array.isArray(item.shots)) {
            item.shots.forEach(s => {
                shotsHtml += `
                    <div class="shot-card">
                        <div class="shot-title">${s.name || 'Shot'}</div>
                        <div class="shot-desc">${s.desc || ''}</div>
                    </div>
                `;
            });
        } else if (item.details) {
            shotsHtml += `<div class="shot-desc">${item.details}</div>`;
        }

        html += `
            <tr>
                <td><span class="badge ${badgeClass}">${typeStr}</span></td>
                <td><strong style="color: #f8fafc;">${item.title || ''}</strong></td>
                <td>${shotsHtml}</td>
                <td><span style="color: #a5b4fc;">${item.audio_or_style || '-'}</span></td>
            </tr>
        `;
    });

    html += `</tbody></table>`;
    document.getElementById('outputContainer').innerHTML = html;
}

function downloadAsImage() {
    const element = document.getElementById('exportContainer');
    const clientName = document.getElementById('clientName').value.trim() || 'Client';

    html2canvas(element, {
        backgroundColor: '#151c2c',
        scale: 2,
        useCORS: true,
        scrollX: 0,
        scrollY: 0
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = `خطة_محتوى_${clientName}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}
</script>

</body>
</html>
