<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد خطط المحتوى الذكي | TEAM ALPHA</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1 { text-align: center; margin-bottom: 24px; }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width { grid-column: 1 / -1; }

        label { font-size: 0.9rem; color: var(--text-muted); }

        input, textarea {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 8px;
            outline: none;
        }

        .api-input-container {
            display: flex;
            gap: 10px;
        }

        .api-input-container input { flex: 1; }

        .btn-test {
            background-color: #475569;
            width: auto;
            padding: 10px 16px;
            white-space: nowrap;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        button:hover { background-color: var(--accent-hover); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        #apiStatus {
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .output-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .output-table th, .output-table td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: right;
        }

        .output-table th { background-color: var(--bg-color); color: var(--accent-color); }
        .badge-reel { background-color: #3b82f620; color: #60a5fa; border: 1px solid #3b82f6; padding: 2px 6px; border-radius: 4px; }
        .badge-poster { background-color: #ec489920; color: #f472b6; border: 1px solid #ec4899; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 مولد خطط المحتوى الشهري (AI)</h1>

    <div class="card">
        <div class="form-grid">
            <div class="form-group full-width">
                <label for="apiKey">Gemini API Key</label>
                <div class="api-input-container">
                    <input type="password" id="apiKey" placeholder="ضع المفتاح الخاص بك هنا">
                    <button class="btn-test" onclick="testApiKey()">اختبار المفتاح 🔍</button>
                </div>
                <div id="apiStatus"></div>
            </div>
            <div class="form-group">
                <label for="clientName">اسم العميل</label>
                <input type="text" id="clientName" placeholder="مثال: مطعم زوز">
            </div>
            <div class="form-group">
                <label for="industry">المجال</label>
                <input type="text" id="industry" placeholder="مثال: أكلات سريعة">
            </div>
            <div class="form-group">
                <label for="reelsCount">عدد الريلز</label>
                <input type="number" id="reelsCount" value="4" min="0">
            </div>
            <div class="form-group">
                <label for="postersCount">عدد البوسترات</label>
                <input type="number" id="postersCount" value="4" min="0">
            </div>
            <div class="form-group full-width">
                <label for="goals">أهداف الحملة</label>
                <textarea id="goals" rows="2" placeholder="زيادة المبيعات والعروض..."></textarea>
            </div>
        </div>
        <button id="generateBtn" onclick="generateContent()">توليد الأفكار الآن ✨</button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <h2>📋 خطة المحتوى</h2>
        <div id="loading" style="display:none; text-align:center; padding: 20px;">جاري توليد الأفكار... ⏳</div>
        <div id="outputContainer"></div>
    </div>
</div>

<script>
// اختبر صحة المفتاح أولاً
async function testApiKey() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const statusDiv = document.getElementById('apiStatus');
    
    if (!apiKey) {
        statusDiv.style.color = "var(--error-color)";
        statusDiv.innerText = "يرجى كتابة المفتاح أولاً!";
        return;
    }

    statusDiv.style.color = "var(--text-muted)";
    statusDiv.innerText = "جاري التحقق من المفتاح...";

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        const data = await res.json();

        if (res.ok) {
            statusDiv.style.color = "var(--success-color)";
            statusDiv.innerText = "✅ المفتاح شغال تمام ومظبوط!";
        } else {
            statusDiv.style.color = "var(--error-color)";
            statusDiv.innerText = `❌ خطأ: ${data.error?.message || 'المفتاح غير صحيح'}`;
        }
    } catch (e) {
        statusDiv.style.color = "var(--error-color)";
        statusDiv.innerText = "❌ تعذر الاتصال بالخادم، تأكد من اتصال الإنترنت.";
    }
}

async function generateContent() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const clientName = document.getElementById('clientName').value.trim();
    const industry = document.getElementById('industry').value.trim();
    const reelsCount = document.getElementById('reelsCount').value;
    const postersCount = document.getElementById('postersCount').value;
    const goals = document.getElementById('goals').value.trim();

    if (!apiKey || !clientName || !industry) {
        alert('برجاء إدخال المفتاح وباقي بيانات العميل الأساسية!');
        return;
    }

    const btn = document.getElementById('generateBtn');
    const resultCard = document.getElementById('resultCard');
    const loading = document.getElementById('loading');
    const outputContainer = document.getElementById('outputContainer');

    btn.disabled = true;
    resultCard.style.display = 'block';
    loading.style.display = 'block';
    outputContainer.innerHTML = '';

    const prompt = `أنت صانع محتوى إبداعي. قم بإنشاء خطة محتوى لعميل:
- البراند: ${clientName} | المجال: ${industry} | الهدف: ${goals}
- المطلوب: ${reelsCount} ريلز و ${postersCount} بوسترات.
قم بتوليد أفكار تريند وجديدة، ورشح صوت/أغنية لكل فيديو.
أرجع الإجابة فقط بصيغة JSON بالتنسيق التالي:
[
  {
    "type": "Reel" أو "Poster",
    "title": "العنوان",
    "details": "التفاصيل والسكريبت",
    "audio_or_style": "الصوت أو الاستايل"
  }
]`;

    // قائمة الموديلات التي يتم تجربتها في حالة فشل أحدهما
    const models = ['gemini-2.5-flash', 'gemini-1.5-flash'];
    let success = false;

    for (let model of models) {
        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            const data = await response.json();
            
            if (response.ok && data.candidates) {
                const rawText = data.candidates[0].content.parts[0].text;
                const ideas = JSON.parse(rawText);
                renderTable(ideas);
                success = true;
                break;
            }
        } catch (e) {
            console.warn(`فشل الاتصال بموديل ${model}`);
        }
    }

    if (!success) {
        outputContainer.innerHTML = `<p style="color: var(--error-color);">فشل التوليد! اضغط على زر "اختبار المفتاح 🔍" بالأعلى لتحديد سبب المشكلة بدقة.</p>`;
    }

    btn.disabled = false;
    loading.style.display = 'none';
}

function renderTable(ideas) {
    let html = `
        <table class="output-table">
            <thead>
                <tr>
                    <th>النوع</th>
                    <th>الفكرة</th>
                    <th>التفاصيل والسكريبت</th>
                    <th>الصوت / الستايل</th>
                </tr>
            </thead>
            <tbody>
    `;

    ideas.forEach(item => {
        const badge = item.type.toLowerCase() === 'reel' ? 'badge-reel' : 'badge-poster';
        html += `
            <tr>
                <td><span class="${badge}">${item.type}</span></td>
                <td><strong>${item.title}</strong></td>
                <td>${item.details}</td>
                <td>${item.audio_or_style || '-'}</td>
            </tr>
        `;
    });

    html += `</tbody></table>`;
    document.getElementById('outputContainer').innerHTML = html;
}
</script>

</body>
</html>
