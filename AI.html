<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OFFGRID Studio — Fast & Accurate AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --surface-card: #0d111a;
            --border-subtle: #1e293b;
            --offgrid-blue: #38bdf8;
            --offgrid-grad: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --radius: 12px;
            --font-main: 'Tajawal', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-main); background-color: var(--bg-dark); color: var(--text-main); padding: 16px 12px; display: flex; justify-content: center; min-height: 100vh; }
        .app-wrapper { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 16px; }

        .brand-header { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: 16px; display: flex; justify-content: space-between; align-items: center; }
        .brand-logo { font-size: 1.5rem; font-weight: 900; background: var(--offgrid-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .navigation-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .nav-card { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; }
        .nav-card:hover { border-color: var(--offgrid-blue); transform: translateY(-2px); }
        .nav-card-icon { font-size: 2rem; margin-bottom: 8px; }

        .btn-back { background: #131b2e; color: var(--offgrid-blue); border: 1px solid var(--border-subtle); padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-bottom: 12px; }

        .card { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: 18px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 700; }
        input, textarea, select { background: var(--bg-dark); border: 1px solid var(--border-subtle); color: #fff; padding: 10px; border-radius: 8px; font-family: inherit; font-size: 0.9rem; }
        input:focus, textarea:focus, select:focus { border-color: var(--offgrid-blue); outline: none; }

        .btn-primary { background: var(--offgrid-grad); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; width: 100%; font-size: 1rem; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .generated-images-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 14px; }
        .img-card { background: var(--bg-dark); border: 1px solid var(--border-subtle); border-radius: 8px; overflow: hidden; }
        .img-card img { width: 100%; height: 280px; object-fit: cover; }
        .img-card a { display: block; text-align: center; padding: 8px; background: var(--offgrid-grad); color: #fff; text-decoration: none; font-weight: 700; font-size: 0.85rem; }

        .idea-item { background: var(--bg-dark); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .idea-badge { background: rgba(56, 189, 248, 0.15); color: var(--offgrid-blue); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 700; }
        .shot-box { background: var(--surface-card); border-right: 3px solid var(--offgrid-blue); padding: 8px 12px; margin-top: 6px; border-radius: 4px; font-size: 0.85rem; }

        @media (max-width: 600px) { .navigation-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="app-wrapper">
    <header class="brand-header">
        <span class="brand-logo">OFFGRID AI</span>
        <input type="password" id="apiKey" placeholder="Gemini API Key..." style="width: 180px;" oninput="localStorage.setItem('offgrid_key', this.value.trim())">
    </header>

    <!-- القائمة الرئيسية -->
    <div id="mainMenu" class="navigation-grid">
        <div class="nav-card" onclick="openSection('ideasSec')">
            <div class="nav-card-icon">⚡</div>
            <h3>مولد الأفكار السريع</h3>
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top:4px;">توليد كلي فور في ثوانٍ معدودة</p>
        </div>
        <div class="nav-card" onclick="openSection('imgSec')">
            <div class="nav-card-icon">🎯</div>
            <h3>مولد الصور الدقيق</h3>
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top:4px;">صور واقعية مطابقة تماماً لوصفك</p>
        </div>
        <div class="nav-card" onclick="openSection('posterSec')">
            <div class="nav-card-icon">🎨</div>
            <h3>محرر البوسترات</h3>
            <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top:4px;">الكتابة والتعديل على الصور</p>
        </div>
    </div>

    <!-- قسم الأفكار -->
    <div id="ideasSec" style="display:none;">
        <button class="btn-back" onclick="showMenu()">➔ العودة</button>
        <div class="card">
            <div class="form-group">
                <label>اسم البراند والمجال</label>
                <input type="text" id="brandInfo" placeholder="مثال: مطعم أكلات سريعة في الحوامدية">
            </div>
            <div class="form-group">
                <label>تفاصيل ووصف الحملة / الهدف</label>
                <textarea id="campaignGoals" rows="2" placeholder="التركيز على العروض وجودة الأكل"></textarea>
            </div>
            <button id="genIdeasBtn" class="btn-primary" onclick="generateIdeasFast()">توليد الخطة فوراً 🚀</button>
            <div id="ideasStatus" style="margin-top:10px; font-weight:700; color:var(--offgrid-blue);"></div>
            <div id="ideasOutput" style="margin-top:14px;"></div>
        </div>
    </div>

    <!-- قسم الصور -->
    <div id="imgSec" style="display:none;">
        <button class="btn-back" onclick="showMenu()">➔ العودة</button>
        <div class="card">
            <div class="form-group">
                <label>اكتب الوصف بالتفصيل (بالعربي أو الإنجليزي):</label>
                <textarea id="imgPrompt" rows="3" placeholder="مثال: صورة فوتوغرافية حقيقية لشاب مصري 25 سنة يبتسم ويمسك ساندوتش، تفاصيل الوجه والجلد واضحة جدا، إضاءة استوديو سينمائية"></textarea>
            </div>
            <div class="form-group">
                <label>العدد الأبعاد:</label>
                <select id="imgAspect">
                    <option value="1024x1024">مربع (1:1)</option>
                    <option value="768x1280">ستوري / ريلز (9:16)</option>
                </select>
            </div>
            <button id="genImgBtn" class="btn-primary" onclick="generateRealImage()">توليد الصورة المطابقة 🎯</button>
            <div id="imgStatus" style="margin-top:10px; font-weight:700; color:var(--offgrid-blue);"></div>
            <div id="imgGallery" class="generated-images-grid"></div>
        </div>
    </div>

    <!-- قسم البوسترات -->
    <div id="posterSec" style="display:none;">
        <button class="btn-back" onclick="showMenu()">➔ العودة</button>
        <div class="card">
            <input type="file" accept="image/*" onchange="loadPoster(event)">
            <div style="margin-top:10px; display:flex; gap:8px;">
                <input type="text" id="pTitle" placeholder="العنوان الرئيسي" oninput="drawPoster()">
                <input type="text" id="pSub" placeholder="العنوان الفرعي" oninput="drawPoster()">
            </div>
            <canvas id="pCanvas" style="max-width:100%; margin-top:10px; border:1px solid var(--border-subtle); display:none;"></canvas>
        </div>
    </div>
</div>

<script>
window.onload = () => {
    const k = localStorage.getItem('offgrid_key');
    if(k) document.getElementById('apiKey').value = k;
};

function openSection(id) {
    document.getElementById('mainMenu').style.display = 'none';
    ['ideasSec', 'imgSec', 'posterSec'].forEach(s => document.getElementById(s).style.display = 'none');
    document.getElementById(id).style.display = 'block';
}

function showMenu() {
    ['ideasSec', 'imgSec', 'posterSec'].forEach(s => document.getElementById(s).style.display = 'none');
    document.getElementById('mainMenu').style.display = 'grid';
}

// 1. توليد أفكار سريع جداً بطلب واحد مباشر
async function generateIdeasFast() {
    const key = document.getElementById('apiKey').value.trim();
    const info = document.getElementById('brandInfo').value.trim();
    const goals = document.getElementById('campaignGoals').value.trim();

    if(!key || !info) { alert('ادخل API Key واسم البراند!'); return; }

    const btn = document.getElementById('genIdeasBtn');
    const status = document.getElementById('ideasStatus');
    const out = document.getElementById('ideasOutput');

    btn.disabled = true;
    status.innerText = 'جاري التوليد السريع... ⚡';
    out.innerHTML = '';

    const prompt = `أنت خبير تسويق. قم بكتابة 3 أفكار ريلز وفكرتين بوستر لـ (${info}) والهدف (${goals}).
أرجع الناتج في صيغة JSON Array فقط كالتالي بدون أي كلام آخر:
[
  {"type": "Reel", "title": "عنوان الفكرة", "desc": "وصف المشهد والسكريبت المختصر"},
  {"type": "Poster", "title": "عنوان البوستر", "desc": "الوصف والفكره البصرية"}
]`;

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        let txt = data.candidates[0].content.parts[0].text;
        txt = txt.replace(/```json/g, '').replace(/```/g, '').trim();
        const json = JSON.parse(txt);

        json.forEach(item => {
            out.innerHTML += `
                <div class="idea-item">
                    <span class="idea-badge">${item.type}</span>
                    <strong style="margin-right:6px;">${item.title}</strong>
                    <div class="shot-box">${item.desc}</div>
                </div>
            `;
        });
        status.innerText = '✨ تم التوليد بنجاح!';
    } catch(e) {
        status.innerText = '❌ حدث خطأ، تأكد من المفتاح أو حاول مجدداً.';
    }
    btn.disabled = false;
}

// 2. توليد صور واقعية ومطابقة 100%
function generateRealImage() {
    const promptText = document.getElementById('imgPrompt').value.trim();
    if(!promptText) { alert('اكتب وصف الصورة أولاً!'); return; }

    const status = document.getElementById('imgStatus');
    const gallery = document.getElementById('imgGallery');
    const dim = document.getElementById('imgAspect').value.split('x');

    status.innerText = 'جاري التوليد بدقة عالية... 🎯';
    gallery.innerHTML = '';

    // إجبار الموديل على إخراج صورة فوتوغرافية واقعية ومطابقة
    const fullPrompt = encodeURIComponent(`${promptText}, photorealistic photo, hyperrealistic skin texture, detailed face, studio lighting, highly detailed, 8k resolution`);
    const seed = Math.floor(Math.random() * 9999999);
    const imgUrl = `https://image.pollinations.ai/prompt/${fullPrompt}?width=${dim[0]}&height=${dim[1]}&seed=${seed}&model=flux&nologo=true`;

    const card = document.createElement('div');
    card.className = 'img-card';
    card.innerHTML = `
        <img src="${imgUrl}" alt="Real Image" onload="document.getElementById('imgStatus').innerText='✨ تم التوليد بنجاح!';" onerror="document.getElementById('imgStatus').innerText='❌ حاول مرة أخرى';">
        <a href="${imgUrl}" target="_blank" download>تحميل الصورة HD 📥</a>
    `;
    gallery.appendChild(card);
}

// 3. البوسترات
let loadedImg = null;
function loadPoster(e) {
    const file = e.target.files[0];
    if(!file) return;
    const r = new FileReader();
    r.onload = (evt) => {
        loadedImg = new Image();
        loadedImg.src = evt.target.result;
        loadedImg.onload = () => {
            document.getElementById('pCanvas').style.display = 'block';
            drawPoster();
        }
    };
    r.readAsDataURL(file);
}

function drawPoster() {
    if(!loadedImg) return;
    const cvs = document.getElementById('pCanvas');
    const ctx = cvs.getContext('2d');
    cvs.width = loadedImg.width;
    cvs.height = loadedImg.height;
    ctx.drawImage(loadedImg, 0, 0);

    const t = document.getElementById('pTitle').value;
    const s = document.getElementById('pSub').value;

    if(t || s) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, cvs.height * 0.75, cvs.width, cvs.height * 0.25);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = `bold ${cvs.width * 0.05}px Tajawal`;
        if(t) ctx.fillText(t, cvs.width/2, cvs.height * 0.85);
        ctx.font = `${cvs.width * 0.03}px Tajawal`;
        if(s) ctx.fillText(s, cvs.width/2, cvs.height * 0.92);
    }
}
</script>
</body>
</html>
