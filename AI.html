<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد افكار OFFGRID</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1 { 
            text-align: center; 
            margin-bottom: 24px;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width { grid-column: 1 / -1; }

        label { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }

        input, textarea {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        .api-input-container {
            display: flex;
            gap: 10px;
        }

        .api-input-container input { flex: 1; }

        .btn-test {
            background-color: #475569;
            width: auto;
            padding: 10px 16px;
            white-space: nowrap;
        }

        .btn-test:hover { background-color: #334155; }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover { background-color: var(--accent-hover); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-download {
            background-color: var(--success-color);
            margin-top: 20px;
        }
        .btn-download:hover { background-color: #16a34a; }

        #apiStatus {
            font-size: 0.85rem;
            margin-top: 4px;
        }

        /* تنسيق الجدول الأنيق للتصدير */
        #exportContainer {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
        }

        .output-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            font-size: 0.95rem;
        }

        .output-table th, .output-table td {
            border: 1px solid var(--border-color);
            padding: 14px;
            text-align: right;
            vertical-align: top;
            line-height: 1.5;
        }

        .output-table th { 
            background-color: #0f172a; 
            color: #818cf8; 
            font-size: 1rem;
        }

        .badge-reel { 
            background-color: #1e3a8a; 
            color: #93c5fd; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 0.85rem;
            display: inline-block;
        }

        .badge-poster { 
            background-color: #831843; 
            color: #fbcfe8; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 0.85rem;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 مولد افكار OFFGRID</h1>

    <div class="card">
        <div class="form-grid">
            <div class="form-group full-width">
                <label for="apiKey">Gemini API Key</label>
                <div class="api-input-container">
                    <input type="password" id="apiKey" placeholder="ضع المفتاح الخاص بك هنا">
                    <button class="btn-test" id="testBtn" onclick="testApiKey()">اختبار المفتاح 🔍</button>
                </div>
                <div id="apiStatus"></div>
            </div>
            <div class="form-group">
                <label for="clientName">اسم العميل / البراند</label>
                <input type="text" id="clientName" placeholder="مثال: مطعم زوز">
            </div>
            <div class="form-group">
                <label for="industry">المجال</label>
                <input type="text" id="industry" placeholder="مثال: أكلات سريعة">
            </div>
            <div class="form-group">
                <label for="reelsCount">عدد الريلز</label>
                <input type="number" id="reelsCount" value="4" min="0">
            </div>
            <div class="form-group">
                <label for="postersCount">عدد البوسترات</label>
                <input type="number" id="postersCount" value="4" min="0">
            </div>
            <div class="form-group full-width">
                <label for="goals">أهداف الحملة</label>
                <textarea id="goals" rows="2" placeholder="زيادة المبيعات والعروض..."></textarea>
            </div>
        </div>
        <button id="generateBtn" onclick="generateContent()">توليد الأفكار الآن ✨</button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <div id="loading" style="display:none; text-align:center; padding: 20px;">جاري توليد الأفكار... ⏳</div>
        
        <div id="exportContainer">
            <h2 id="planTitle" style="margin-top:0; text-align:center; color: #818cf8;">📋 خطة المحتوى</h2>
            <div id="outputContainer"></div>
        </div>

        <button id="downloadBtn" class="btn-download" style="display:none;" onclick="downloadAsImage()">تحميل الجدول كصورة 📸</button>
    </div>
</div>

<script>
async function testApiKey() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const statusDiv = document.getElementById('apiStatus');
    
    if (!apiKey) {
        statusDiv.style.color = "var(--error-color)";
        statusDiv.innerText = "يرجى كتابة المفتاح أولاً!";
        return;
    }

    statusDiv.style.color = "var(--text-muted)";
    statusDiv.innerText = "جاري التحقق من المفتاح...";

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        const data = await res.json();

        if (res.ok) {
            statusDiv.style.color = "var(--success-color)";
            statusDiv.innerText = "✅ المفتاح شغال تمام ومظبوط!";
        } else {
            statusDiv.style.color = "var(--error-color)";
            statusDiv.innerText = `❌ خطأ: ${data.error?.message || 'المفتاح غير صحيح'}`;
        }
    } catch (e) {
        statusDiv.style.color = "var(--error-color)";
        statusDiv.innerText = "❌ تعذر الاتصال بالخادم، تأكد من اتصال الإنترنت.";
    }
}

async function generateContent() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const clientName = document.getElementById('clientName').value.trim();
    const industry = document.getElementById('industry').value.trim();
    const reelsCount = document.getElementById('reelsCount').value;
    const postersCount = document.getElementById('postersCount').value;
    const goals = document.getElementById('goals').value.trim();

    if (!apiKey || !clientName || !industry) {
        alert('برجاء إدخال المفتاح واسم العميل والمجال!');
        return;
    }

    const btn = document.getElementById('generateBtn');
    const resultCard = document.getElementById('resultCard');
    const loading = document.getElementById('loading');
    const outputContainer = document.getElementById('outputContainer');
    const downloadBtn = document.getElementById('downloadBtn');

    btn.disabled = true;
    resultCard.style.display = 'block';
    loading.style.display = 'block';
    downloadBtn.style.display = 'none';
    outputContainer.innerHTML = '';

    document.getElementById('planTitle').innerText = `📋 خطة محتوى: ${clientName}`;

    const promptText = `أنت صانع محتوى إبداعي وميديا باير. قم بإنشاء خطة محتوى شهرية لعميل:
- البراند: ${clientName}
- المجال: ${industry}
- الهدف: ${goals}
- المطلوب: ${reelsCount} فيديو ريلز (Reels) و ${postersCount} تصميم بوستر (Posters).

المطلوب إرجاع الناتج في صيغة JSON Array فقط بدون أي كلام إضافي وبدون علامات تنصيص markdown.
مثال التنسيق المطلوب تماماً:
[
  {
    "type": "Reel",
    "title": "عنوان الفكرة",
    "details": "تفاصيل الفيديو والسكريبت",
    "audio_or_style": "الصوت التريند المقترح"
  }
]`;

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }]
            })
        });

        const data = await response.json();
        
        if (response.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
            let rawText = data.candidates[0].content.parts[0].text;
            rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();

            const ideas = JSON.parse(rawText);
            renderTable(ideas);
            downloadBtn.style.display = 'block';
        } else {
            const errorMsg = data.error?.message || 'فشل التوليد، تأكد من صحة البيانات والمفتاح.';
            outputContainer.innerHTML = `
                <div style="color: var(--error-color); text-align: center; padding: 10px;">
                    <p>⚠️ تعذر توليد الأفكار.</p>
                    <small style="color: var(--text-muted);">سبب الخطأ: ${errorMsg}</small>
                </div>
            `;
        }
    } catch (e) {
        outputContainer.innerHTML = `
            <div style="color: var(--error-color); text-align: center; padding: 10px;">
                <p>⚠️ حدث خطأ في الاتصال بالشبكة.</p>
                <small style="color: var(--text-muted);">${e.message}</small>
            </div>
        `;
    }

    btn.disabled = false;
    loading.style.display = 'none';
}

function renderTable(ideas) {
    let html = `
        <table class="output-table">
            <thead>
                <tr>
                    <th style="width: 12%;">النوع</th>
                    <th style="width: 25%;">عنوان الفكرة</th>
                    <th style="width: 43%;">التفاصيل والسكريبت</th>
                    <th style="width: 20%;">الصوت / الستايل</th>
                </tr>
            </thead>
            <tbody>
    `;

    ideas.forEach(item => {
        const typeStr = item.type || 'Reel';
        const isReel = typeStr.toLowerCase().includes('reel');
        const badge = isReel ? 'badge-reel' : 'badge-poster';
        html += `
            <tr>
                <td><span class="${badge}">${typeStr}</span></td>
                <td><strong>${item.title || ''}</strong></td>
                <td>${item.details || ''}</td>
                <td>${item.audio_or_style || '-'}</td>
            </tr>
        `;
    });

    html += `</tbody></table>`;
    document.getElementById('outputContainer').innerHTML = html;
}

function downloadAsImage() {
    const element = document.getElementById('exportContainer');
    const clientName = document.getElementById('clientName').value.trim() || 'Client';

    html2canvas(element, {
        backgroundColor: '#1e293b',
        scale: 2
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = `خطة_محتوى_${clientName}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}
</script>

</body>
</html>
