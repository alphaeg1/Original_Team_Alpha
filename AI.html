<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد خطط المحتوى الذكي | TEAM ALPHA</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, textarea {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .output-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .output-table th, .output-table td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: right;
            vertical-align: top;
        }

        .output-table th {
            background-color: var(--bg-color);
            color: var(--accent-color);
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .badge-reel { background-color: #3b82f620; color: #60a5fa; border: 1px solid #3b82f6; }
        .badge-poster { background-color: #ec489920; color: #f472b6; border: 1px solid #ec4899; }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 مولد خطط المحتوى الشهري (AI)</h1>

    <div class="card">
        <div class="form-grid">
            <div class="form-group full-width">
                <label for="apiKey">Gemini API Key</label>
                <input type="password" id="apiKey" placeholder="ضع مفتاح API الخاص بك هنا">
            </div>
            <div class="form-group">
                <label for="clientName">اسم العميل / البراند</label>
                <input type="text" id="clientName" placeholder="مثال: مطعم زوز">
            </div>
            <div class="form-group">
                <label for="industry">مجال العمل</label>
                <input type="text" id="industry" placeholder="مثال: مأكولات سريعة">
            </div>
            <div class="form-group">
                <label for="reelsCount">عدد الريلز (Reels)</label>
                <input type="number" id="reelsCount" value="4" min="0">
            </div>
            <div class="form-group">
                <label for="postersCount">عدد التصاميم (Posters)</label>
                <input type="number" id="postersCount" value="4" min="0">
            </div>
            <div class="form-group full-width">
                <label for="goals">أهداف الحملة هذا الشهر</label>
                <textarea id="goals" rows="3" placeholder="مثال: زيادة المبيعات، إشهار فرع جديد، التركيز على أكلة معينة..."></textarea>
            </div>
        </div>
        <button id="generateBtn" onclick="generateContent()">توليد الأفكار الآن ✨</button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <h2>📋 خطة المحتوى المقترحة</h2>
        <div id="loading" class="loading">جاري التفكير وتوليد الأفكار التريند... انتظر ثواني ⏳</div>
        <div id="outputContainer"></div>
    </div>
</div>

<script>
async function generateContent() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const clientName = document.getElementById('clientName').value.trim();
    const industry = document.getElementById('industry').value.trim();
    const reelsCount = document.getElementById('reelsCount').value;
    const postersCount = document.getElementById('postersCount').value;
    const goals = document.getElementById('goals').value.trim();

    if (!apiKey) {
        alert('برجاء ادخال Gemini API Key الأول!');
        return;
    }
    if (!clientName || !industry) {
        alert('برجاء إكمال البيانات الأساسية للعميل!');
        return;
    }

    const btn = document.getElementById('generateBtn');
    const resultCard = document.getElementById('resultCard');
    const loading = document.getElementById('loading');
    const outputContainer = document.getElementById('outputContainer');

    btn.disabled = true;
    resultCard.style.display = 'block';
    loading.style.display = 'block';
    outputContainer.innerHTML = '';

    const prompt = `أنت خبير تسويق وصانع محتوى محترف (Social Media Strategist). 
قم بإنشاء خطة محتوى شهرية مبتكرة وعصرية لعميل بالتفاصيل التالية:
- اسم العميل: ${clientName}
- المجال: ${industry}
- الهدف: ${goals}
- المطلوب: عدد (${reelsCount}) فيديو ريلز (Reels) وعدد (${postersCount}) تصاميم/بوسترات (Posters).

شروط المخرجات:
1. ابتكر أفكار جديدة ومختلفة تماماً وغير مكررة.
2. اقترح أفكار متماشية مع التريندات الحالية، واذكر الصوت/الأغنية المناسبة لكل فيديو.
3. قم بتقديم الإجابة على شكل صيغة JSON فقط بدون أي نص إضافي أو شرح خارج الـ JSON.

شكل الـ JSON المطلوب بدقة:
[
  {
    "type": "Reel" أو "Poster",
    "title": "عنوان الفكرة",
    "details": "شرح الفكرة أو طريقة التصوير/التصميم",
    "audio_or_style": "الصوت التريند المقترح أو الستايل البصري"
  }
]`;

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    temperature: 0.85,
                    responseMimeType: "application/json"
                }
            })
        });

        const data = await response.json();
        const rawText = data.candidates[0].content.parts[0].text;
        const ideas = JSON.parse(rawText);

        renderTable(ideas);

    } catch (error) {
        console.error(error);
        outputContainer.innerHTML = `<p style="color: #ef4444;">حدث خطأ أثناء الحصول على الأفكار. تأكد من صحة الـ API Key وحاول مرة أخرى.</p>`;
    } finally {
        btn.disabled = false;
        loading.style.display = 'none';
    }
}

function renderTable(ideas) {
    let html = `
        <table class="output-table">
            <thead>
                <tr>
                    <th>النوع</th>
                    <th>الفكرة / العنوان</th>
                    <th>تفاصيل التنفيذ والسكريبت</th>
                    <th>الصوت / الستايل المقترح</th>
                </tr>
            </thead>
            <tbody>
    `;

    ideas.forEach(item => {
        const badgeClass = item.type.toLowerCase() === 'reel' ? 'badge-reel' : 'badge-poster';
        html += `
            <tr>
                <td><span class="badge ${badgeClass}">${item.type}</span></td>
                <td><strong>${item.title}</strong></td>
                <td>${item.details}</td>
                <td>${item.audio_or_style || '-'}</td>
            </tr>
        `;
    });

    html += `</tbody></table>`;
    document.getElementById('outputContainer').innerHTML = html;
}
</script>

</body>
</html>
