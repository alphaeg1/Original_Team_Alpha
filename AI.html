<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مولد أفكار OFFGRID</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Syne:wght@800&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: #111827;
            --card-border: #1f293d;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #10b981;
            --error-color: #ef4444;
            --offgrid-gradient: linear-gradient(135deg, #ff2a5f 0%, #ff7e33 50%, #facc15 100%);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 880px;
        }

        /* الهيدر والوجو الثابت */
        .header-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            gap: 8px;
        }

        .main-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* تنسيق الخط وتصميم كلمة OFFGRID */
        .offgrid-badge {
            font-family: 'Syne', sans-serif;
            background: var(--offgrid-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            filter: drop-shadow(0px 0px 12px rgba(255, 66, 95, 0.35));
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label { 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            font-weight: 700; 
        }

        input, textarea {
            background-color: #0b0f19;
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.92rem;
            font-family: inherit;
            outline: none;
            width: 100%;
            transition: border-color 0.2s ease;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        button.btn-primary {
            background: linear-gradient(135deg, var(--accent-color) 0%, var(--accent-hover) 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
            transition: opacity 0.2s;
        }

        button.btn-primary:hover {
            opacity: 0.92;
        }

        .btn-download {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
        }

        /* التقرير القابل للتصدير */
        #exportContainer {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
        }

        .export-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 14px;
            margin-bottom: 16px;
        }

        .brand-info {
            display: flex;
            flex-direction: column;
        }

        .plan-client-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        .output-table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        .output-table th {
            background-color: #0b0f19;
            color: #818cf8;
            font-size: 0.88rem;
            font-weight: 800;
            padding: 12px 14px;
            text-align: right;
            white-space: nowrap;
        }

        .output-table td {
            background-color: #111827;
            border-bottom: 1px solid var(--card-border);
            padding: 14px;
            vertical-align: top;
            font-size: 0.88rem;
            line-height: 1.6;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.75rem;
            display: inline-block;
            white-space: nowrap;
        }

        .badge-reel { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-poster { background-color: rgba(236, 72, 153, 0.15); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }

        .shot-card {
            background: #0b0f19;
            border-right: 3px solid var(--accent-color);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .shot-title {
            font-weight: 800;
            color: #38bdf8;
            font-size: 0.82rem;
            margin-bottom: 2px;
        }

        /* جعل النصوص قابلة للتعديل المباشر */
        [contenteditable="true"] {
            outline: none;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        [contenteditable="true"]:hover, [contenteditable="true"]:focus {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 1px var(--accent-color);
        }

        .editable-hint {
            font-size: 0.78rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            display: block;
            text-align: left;
        }

        .default-notes-box {
            margin-top: 16px;
            padding: 12px 14px;
            background-color: #0b0f19;
            border-radius: 10px;
            border: 1px dashed var(--card-border);
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .default-notes-title {
            font-weight: 800;
            color: #818cf8;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header-brand">
        <div class="main-title">
            مولد أفكار <span class="offgrid-badge">OFFGRID</span>
        </div>
    </div>

    <div class="card">
        <div class="form-grid">

            <div class="form-group">
                <label for="apiKey">OFFGRID API Key (سيتم حفظه في متصفحك تلقائياً)</label>
                <input type="password" id="apiKey" placeholder="أدخل مفتاح الـ API هنا مرة واحدة فقط" oninput="saveApiKey()">
            </div>

            <div class="form-row-2">
                <div class="form-group">
                    <label for="clientName">اسم العميل</label>
                    <input type="text" id="clientName" placeholder="مثال: مطعم زوز">
                </div>
                <div class="form-group">
                    <label for="industry">المجال</label>
                    <input type="text" id="industry" placeholder="أكلات سريعة">
                </div>
            </div>

            <div class="form-row-2">
                <div class="form-group">
                    <label for="reelsCount">عدد الريلز</label>
                    <input type="number" id="reelsCount" value="4" min="0">
                </div>
                <div class="form-group">
                    <label for="postersCount">عدد البوسترات</label>
                    <input type="number" id="postersCount" value="4" min="0">
                </div>
            </div>

            <div class="form-group">
                <label for="goals">أهداف الحملة الحالية</label>
                <textarea id="goals" rows="2" placeholder="زيادة المبيعات والعروض..."></textarea>
            </div>

            <div class="form-group">
                <label for="defaultNotes">ملاحظات وشروط ثابتة (تظهر مع كل خطة)</label>
                <textarea id="defaultNotes" rows="2" placeholder="مثال: مدة التنفيذ 7 أيام - يشمل التعديل مرتين مجاناً..." oninput="saveDefaultNotes()"></textarea>
            </div>
        </div>

        <button id="generateBtn" class="btn-primary" onclick="generateContent()">توليد الخطة ✨</button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <div id="loading" style="display:none; text-align:center; padding: 20px; color: var(--text-muted); font-size: 0.95rem;">
            جاري تحضير الخطة وتقسيم الشوتات... ⏳
        </div>
        
        <div id="exportContainer">
            <div class="export-header">
                <div class="brand-info">
                    <div class="plan-client-title" id="planTitle" contenteditable="true">📋 خطة المحتوى</div>
                    <small style="color: var(--text-muted); font-size: 0.78rem;">TEAM ALPHA</small>
                </div>
                <div class="offgrid-badge" style="font-size: 1.4rem;">OFFGRID</div>
            </div>

            <span class="editable-hint">💡 يمكنك الضغط على أي نص في الجدول لتعديله/تخصيصه بشكل مباشر قبل التحميل.</span>

            <div class="table-responsive">
                <div id="outputContainer"></div>
            </div>

            <div id="exportNotesBox" class="default-notes-box" style="display:none;">
                <div class="default-notes-title">📌 ملاحظات الشروط والأحكام:</div>
                <div id="exportNotesText" contenteditable="true"></div>
            </div>
        </div>

        <button id="downloadBtn" class="btn-download" style="display:none;" onclick="downloadAsImage()">تحميل التقرير كصورة 📸</button>
    </div>

</div>

<script>
window.onload = function() {
    // استرجاع الـ API Key والملاحظات من المتصفح تلقائياً
    const savedKey = localStorage.getItem('offgrid_api_key');
    if (savedKey) {
        document.getElementById('apiKey').value = savedKey;
    }

    const savedNotes = localStorage.getItem('offgrid_default_notes');
    if (savedNotes) {
        document.getElementById('defaultNotes').value = savedNotes;
    }
}

function saveApiKey() {
    const key = document.getElementById('apiKey').value.trim();
    localStorage.setItem('offgrid_api_key', key);
}

function saveDefaultNotes() {
    const val = document.getElementById('defaultNotes').value;
    localStorage.setItem('offgrid_default_notes', val);
}

async function generateContent() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const clientName = document.getElementById('clientName').value.trim();
    const industry = document.getElementById('industry').value.trim();
    const reelsCount = document.getElementById('reelsCount').value;
    const postersCount = document.getElementById('postersCount').value;
    const goals = document.getElementById('goals').value.trim();
    const defaultNotes = document.getElementById('defaultNotes').value.trim();

    if (!apiKey) {
        alert('برجاء إدخال الـ API Key!');
        return;
    }

    if (!clientName || !industry) {
        alert('برجاء كتابة اسم العميل والمجال!');
        return;
    }

    const btn = document.getElementById('generateBtn');
    const resultCard = document.getElementById('resultCard');
    const loading = document.getElementById('loading');
    const outputContainer = document.getElementById('outputContainer');
    const downloadBtn = document.getElementById('downloadBtn');

    btn.disabled = true;
    resultCard.style.display = 'block';
    loading.style.display = 'block';
    downloadBtn.style.display = 'none';
    outputContainer.innerHTML = '';

    document.getElementById('planTitle').innerText = `📋 خطة: ${clientName}`;

    const exportNotesBox = document.getElementById('exportNotesBox');
    if (defaultNotes) {
        document.getElementById('exportNotesText').innerText = defaultNotes;
        exportNotesBox.style.display = 'block';
    } else {
        exportNotesBox.style.display = 'none';
    }

    const promptText = `أنت صانع محتوى إبداعي ومخرج إعلانات. قم بإنشاء خطة محتوى شهرية لعميل:
- البراند: ${clientName}
- المجال: ${industry}
- الهدف: ${goals}
- المطلوب: ${reelsCount} فيديو ريلز (Reels) و ${postersCount} تصميم بوستر (Posters).

⚠️ لكل فيديو Reel، اقسم السكريبت لشوتات سينمائية (Shots) تحتوي على المشهد والتعليق.
ولكل بوستر (Poster)، ضع تفاصيل الفكرة والنص الإعلاني.

ارجع الناتج في صيغة JSON Array فقط بدون markdown.
[
  {
    "type": "Reel",
    "title": "عنوان الفكرة الجذاب",
    "shots": [
      { "name": "Shot 1 - Hook", "desc": "وصف المشهد والبداية" },
      { "name": "Shot 2 - Value", "desc": "وصف تفاصيل العرض" },
      { "name": "Shot 3 - CTA", "desc": "المشهد النهائي" }
    ],
    "audio_or_style": "الصوت المقترح"
  }
]`;

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }]
            })
        });

        const data = await response.json();
        
        if (response.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
            let rawText = data.candidates[0].content.parts[0].text;
            rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();

            const ideas = JSON.parse(rawText);
            renderTable(ideas);
            downloadBtn.style.display = 'block';
        } else {
            outputContainer.innerHTML = `<div style="color:var(--error-color); text-align:center;">⚠️ فشل التوليد، تأكد من صحة الـ API Key.</div>`;
        }
    } catch (e) {
        outputContainer.innerHTML = `<div style="color:var(--error-color); text-align:center;">⚠️ خطأ في الاتصال بالشبكة.</div>`;
    }

    btn.disabled = false;
    loading.style.display = 'none';
}

function renderTable(ideas) {
    let html = `
        <table class="output-table">
            <thead>
                <tr>
                    <th style="width: 15%;">النوع</th>
                    <th style="width: 25%;">عنوان الفكرة</th>
                    <th style="width: 42%;">التفاصيل والسكريبت (Shots)</th>
                    <th style="width: 18%;">الصوت / الستايل</th>
                </tr>
            </thead>
            <tbody>
    `;

    ideas.forEach(item => {
        const typeStr = item.type || 'Reel';
        const isReel = typeStr.toLowerCase().includes('reel');
        const badgeClass = isReel ? 'badge-reel' : 'badge-poster';
        
        let shotsHtml = '';
        if (item.shots && Array.isArray(item.shots)) {
            item.shots.forEach(s => {
                shotsHtml += `
                    <div class="shot-card">
                        <div class="shot-title" contenteditable="true">${s.name || 'Shot'}</div>
                        <div class="shot-desc" contenteditable="true">${s.desc || ''}</div>
                    </div>
                `;
            });
        } else if (item.details) {
            shotsHtml += `<div class="shot-desc" contenteditable="true">${item.details}</div>`;
        }

        html += `
            <tr>
                <td><span class="badge ${badgeClass}" contenteditable="true">${typeStr}</span></td>
                <td><strong style="color: #f8fafc;" contenteditable="true">${item.title || ''}</strong></td>
                <td>${shotsHtml}</td>
                <td><span style="color: #a5b4fc;" contenteditable="true">${item.audio_or_style || '-'}</span></td>
            </tr>
        `;
    });

    html += `</tbody></table>`;
    document.getElementById('outputContainer').innerHTML = html;
}

function downloadAsImage() {
    const element = document.getElementById('exportContainer');
    const clientName = document.getElementById('clientName').value.trim() || 'Client';

    html2canvas(element, {
        backgroundColor: '#111827',
        scale: 2,
        useCORS: true,
        scrollX: 0,
        scrollY: 0
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = `خطة_محتوى_${clientName}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
}
</script>

</body>
</html>
