<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Phone - صيانة وبيع هواتف</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0d0d0d;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-white: #ffffff;
            --text-gray: #a1a1aa;
            --accent-gray: #27272a;
            --glow-color: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #1c1c22 0%, var(--bg-dark) 100%);
            color: var(--primary-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* الهيدر واللوجو الرئيسي */
        .header {
            text-align: center;
            margin-top: 10px;
        }

        .logo-box {
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            backdrop-filter: blur(8px);
            position: relative;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-placeholder {
            font-weight: bold;
            font-size: 14px;
            color: var(--text-gray);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--primary-white);
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-gray);
        }

        /* الروابط والأزرار الفخمة */
        .links-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            background-color: var(--primary-white);
            color: var(--bg-dark);
            text-decoration: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
            background-color: #f4f4f5;
        }

        .btn i {
            font-size: 18px;
        }

        .btn-outline {
            background-color: var(--card-bg);
            color: var(--primary-white);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            color: var(--primary-white);
        }

        /* قسم الخريطة */
        .location-section {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .location-section h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: var(--primary-white);
        }

        .map-container {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            filter: grayscale(80%) contrast(1.2); /* إعطاء الخريطة مظهر مونوكروم فخم */
            transition: filter 0.3s ease;
        }

        .map-container:hover {
            filter: grayscale(0%);
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* حاوية اللوجو المتحرك (TA Box) */
        .ta-bounce-box {
            width: 100%;
            height: 120px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .ta-logo {
            position: absolute;
            padding: 8px 16px;
            background: var(--primary-white);
            color: var(--bg-dark);
            font-weight: 900;
            font-size: 16px;
            border-radius: 8px;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            user-select: none;
            will-change: transform;
        }

        /* الخانة السفلية لطلب موقع */
        .cta-footer {
            width: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.08) 100%);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
        }

        .cta-footer p {
            font-size: 14px;
            color: var(--text-gray);
            margin-bottom: 12px;
        }

        .cta-btn {
            display: inline-block;
            background-color: var(--primary-white);
            color: var(--bg-dark);
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .cta-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- اللوجو والعنوان -->
        <header class="header">
            <div class="logo-box">
                <img src="WhatsApp Image‏ 2026-07-26 at 22.36.29.jpeg" alt="Fix Phone Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span class="logo-placeholder" style="display:none;">LOGO</span>
            </div>
            <h1>Fix Phone</h1>
            <p class="subtitle">بيع، شراء، وصيانة جميع أنواع الهواتف</p>
        </header>

        <!-- أزرار الاتصال والسوشيال ميديا -->
        <section class="links-section">
            <a href="tel:01000000000" class="btn">
                <i class="fa-solid fa-phone"></i> الاتصال بنا
            </a>

            <a href="https://wa.me/201000000000" target="_blank" class="btn">
                <i class="fa-brands fa-whatsapp"></i> واتساب (WhatsApp)
            </a>

            <a href="https://facebook.com" target="_blank" class="btn btn-outline">
                <i class="fa-brands fa-facebook-f"></i> فيسبوك (Facebook)
            </a>

            <a href="https://instagram.com" target="_blank" class="btn btn-outline">
                <i class="fa-brands fa-instagram"></i> انستجرام (Instagram)
            </a>

            <a href="https://tiktok.com" target="_blank" class="btn btn-outline">
                <i class="fa-brands fa-tiktok"></i> تيك توك (TikTok)
            </a>
        </section>

        <!-- قسم الخريطة -->
        <section class="location-section">
            <h3><i class="fa-solid fa-location-dot"></i> موقعنا على الخريطة</h3>
            <div class="map-container">
                <iframe id="google-map" src="" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </section>

        <!-- مستطيل حركة لوجو TA العشوائية -->
        <section class="ta-bounce-box" id="bounceContainer">
            <div class="ta-logo" id="taLogo">TA</div>
        </section>

        <!-- الخانة السفلية (دعوة لتصميم موقع) -->
        <footer class="cta-footer">
            <p>لو عايز تعمل ويب سايت زاي دي بطريقة أفخم؟</p>
            <a href="https://wa.me/201000000000" target="_blank" class="cta-btn">
                دوس هنا وتواصل معنا
            </a>
        </footer>

    </div>

    <script>
        // ----------------------------------------------------
        // 1. تحديد موقع الخريطة بكل سهولة:
        // فقط اكتب اسم المكان أو المنطقة التي تريدها هنا
        // ----------------------------------------------------
        const myLocation = "Cairo, Egypt"; // اكتب مكانك هنا (مثال: "المهندسين، الجيزة" أو "Nasr City, Cairo")
        
        const mapIframe = document.getElementById("google-map");
        mapIframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(myLocation)}&t=&z=14&ie=UTF8&iwloc=&output=embed`;

        // ----------------------------------------------------
        // 2. حركة لوجو TA العشوائية داخل المستطيل
        // ----------------------------------------------------
        const container = document.getElementById('bounceContainer');
        const logo = document.getElementById('taLogo');

        let posX = 20;
        let posY = 20;
        let speedX = 1.8;
        let speedY = 1.5;

        function animate() {
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            const logoWidth = logo.offsetWidth;
            const logoHeight = logo.offsetHeight;

            posX += speedX;
            posY += speedY;

            // الاصطدام بالحواف الأفقية
            if (posX + logoWidth >= containerWidth || posX <= 0) {
                speedX = -speedX;
            }

            // الاصطدام بالحواف الرأسية
            if (posY + logoHeight >= containerHeight || posY <= 0) {
                speedY = -speedY;
            }

            logo.style.left = posX + 'px';
            logo.style.top = posY + 'px';

            requestAnimationFrame(animate);
        }

        // بدء الحركة بمجرد تحميل الصفحة
        window.onload = () => {
            animate();
        };
    </script>
</body>
</html>
