<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة نقاط العملاء</title>
<!-- استدعاء مكتبة Supabase -->
<script src="[https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2](https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2)"></script>
<style>
body { font-family: sans-serif; text-align: center; background-color: #f4f4f4; padding: 50px; }
.container { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
button { padding: 10px 20px; background-color: #5c3b8a; color: white; border: none; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
<h1>تحديث نقاط الكلاينت</h1>
<input type="text" id="clientId" placeholder="رقم الكلاينت">
<input type="number" id="pointsToAdd" placeholder="عدد النقاط المراد إضافتها">
<button onclick="updatePoints()">إضافة النقاط</button>
<p id="statusMessage"></p>
</div>
<script>
// ضع هنا مفاتيح الاتصال الخاصة بمشروعك من لوحة تحكم Supabase
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
async function updatePoints() {
const clientId = document.getElementById('clientId').value;
const pointsToAdd = parseInt(document.getElementById('pointsToAdd').value);
// جلب النقاط الحالية للكلاينت
const { data, error } = await supabase
.from('Client')
.select('loyalty_points')
.eq('client_number', clientId)
.single();
if (error) {
document.getElementById('statusMessage').innerText = 'خطأ في جلب بيانات العميل: ' + error.message;
return;
}
const currentPoints = data.loyalty_points || 0;
const newTotal = currentPoints + pointsToAdd;
// تحديث النقاط الجديدة في قاعدة البيانات
const { error: updateError } = await supabase
.from('Client')
.update({ loyalty_points: newTotal })
.eq('client_number', clientId);
if (updateError) {
document.getElementById('statusMessage').innerText = 'خطأ في تحديث النقاط: ' + updateError.message;
} else {
document.getElementById('statusMessage').innerText = 'تمت إضافة النقاط بنجاح! الرصيد الجديد: ' + newTotal;
}
}
</script>
</body>
</html>
